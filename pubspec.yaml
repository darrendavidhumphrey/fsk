name: fsk
description: "FlutterSceneKit - lightweight library for adding OpenGL ES 3D rendering to flutter applications"
version: 0.0.1
homepage: https://pub.dev

hook: hook/build.dart

environment:
  sdk: ^3.12.0

dependencies:
  dart_stl: ^0.0.7
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  vector_math: ^2.4.1
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  flutter_gpu_shaders: ^0.5.1
  flutter_lints: ^6.0.0
  hooks: ^2.1.0
  data_assets: ^0.20.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - shaders/
    - shaders/fsk.shaderbundle
